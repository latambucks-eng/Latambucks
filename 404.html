<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>LatamBucks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <!--
      Fallback de rutas para GitHub Pages, que no permite reescribir URLs.

      Rutas como /faq, /terminos o /perfiles existen sólo en el cliente: si
      alguien entra directo a ellas (o recarga la página ahí), GitHub responde
      con este 404. Guardamos la ruta pedida y volvemos al index; el script de
      index.html la restaura antes de que arranque React.

      __BASE_URL__ lo reemplaza el build (vite.config.js) con la base real:
      "/" en dominio raíz o "/nombre-del-repo/" en GitHub Pages de repositorio.
    -->
    <script>
      (function () {
        var path = window.location.pathname + window.location.search + window.location.hash;
        try {
          sessionStorage.setItem("lb_spa_redirect", path);
        } catch (e) {}
        window.location.replace("__BASE_URL__");
      })();
    </script>
  </body>
</html>
