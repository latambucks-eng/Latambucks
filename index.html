  <body>
    <div id="root"></div>

    <!-- Restaura la ruta real cuando el hosting estático sirvió 404.html
         (GitHub Pages) y redirigió al index. Debe correr antes de React y de
         que la app lea window.location.pathname. Sólo acepta rutas internas. -->
    <script>
      (function () {
        try {
          var saved = sessionStorage.getItem("lb_spa_redirect");
          if (!saved) return;
          sessionStorage.removeItem("lb_spa_redirect");
          if (saved.charAt(0) !== "/" || saved.indexOf("//") === 0) return;
          window.history.replaceState(null, "", saved);
        } catch (e) {}
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
